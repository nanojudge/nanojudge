[package]
name = "nanojudge-bench"
version = "0.1.0"
edition = "2024"
description = "Synthetic benchmark harness for NanoJudge ranking accuracy"
license = "MIT"
publish = false

[[bin]]
name = "nanojudge-bench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
tempfile = "3"
